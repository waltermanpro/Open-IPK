name: Build OpenClash IPK

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt version, e.g. 25.12.5 or 24.10.12"
        required: true
        default: "25.12.5"

      openclash_branch:
        description: "OpenClash branch"
        required: true
        default: "master"

jobs:
  build:
    name: OpenClash - OpenWrt ${{ inputs.openwrt_version }} - armvirt/64

    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      OPENWRT_TARGET: armvirt/64
      OPENCLASH_BRANCH: ${{ inputs.openclash_branch }}

    steps:

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            rsync \
            unzip \
            wget \
            zstd \
            file \
            npm

      - name: Download OpenWrt SDK
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"

          echo "=========================================="
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : ${OPENWRT_TARGET}"
          echo "=========================================="

          wget -qO sdk.sha256 \
            "${BASE_URL}/sha256sums"

          SDK=$(awk '
            $2 ~ /^\.\/openwrt-sdk-.*Linux-x86_64\.tar\.zst$/ {
              sub(/^.\//, "", $2)
              print $2
              exit
            }
          ' sdk.sha256)

          if [ -z "${SDK}" ]; then
            echo "ERROR: SDK not found!"
            grep 'openwrt-sdk-.*tar.zst' sdk.sha256 || true
            exit 1
          fi

          echo "SDK: ${SDK}"

          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            -O sdk.tar.zst \
            "${BASE_URL}/${SDK}"

          EXPECTED=$(grep " ${SDK}$" sdk.sha256 | awk '{print $1}')
          ACTUAL=$(sha256sum sdk.tar.zst | awk '{print $1}')

          echo "Expected SHA256: ${EXPECTED}"
          echo "Actual SHA256:   ${ACTUAL}"

          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "ERROR: SHA256 mismatch!"
            exit 1
          fi

          echo "SHA256 verification OK."

      - name: Extract SDK
        run: |
          set -eux

          mkdir -p sdk

          tar \
            --use-compress-program=unzstd \
            -xf sdk.tar.zst \
            -C sdk \
            --strip-components=1

          ls -lah sdk

      - name: Clone OpenClash
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch="${OPENCLASH_BRANCH}" \
            https://github.com/vernesong/OpenClash.git \
            openclash

          echo "OpenClash version:"
          grep '^PKG_VERSION:=' \
            openclash/luci-app-openclash/Makefile || true

          echo "OpenClash commit:"
          git -C openclash rev-parse --short HEAD

      - name: Copy OpenClash package
        run: |
          set -eux

          mkdir -p sdk/package/luci-app-openclash

          cp -a \
            openclash/luci-app-openclash/. \
            sdk/package/luci-app-openclash/

      - name: Build po2lmo
        working-directory: sdk/package/luci-app-openclash/tools/po2lmo
        run: |
          set -eux

          make

          sudo install \
            -m 0755 \
            po2lmo \
            /usr/local/bin/po2lmo

          command -v po2lmo

      - name: Build CodeMirror 6
        working-directory: sdk/package/luci-app-openclash/tools/codemirror
        run: |
          set -eux

          npm install

          npx esbuild \
            entry.js \
            --bundle \
            --format=iife \
            --global-name=CM6 \
            --minify \
            --target=es2019 \
            --outfile=../../root/www/luci-static/resources/openclash/js/cm6.min.js \
            --legal-comments=none \
            --loader:.css=text

          rm -rf node_modules

      - name: SDK defconfig
        working-directory: sdk
        run: |
          set -eux

          make defconfig

      - name: Build OpenClash
        working-directory: sdk
        run: |
          set -eux

          make \
            package/luci-app-openclash/luci-app-openclash/compile \
            V=s

      - name: Find IPK
        run: |
          set -eux

          echo "=========================================="
          echo "Generated IPK"
          echo "=========================================="

          find sdk/bin \
            -type f \
            -name 'luci-app-openclash_*.ipk' \
            -print

          COUNT=$(find sdk/bin \
            -type f \
            -name 'luci-app-openclash_*.ipk' \
            | wc -l)

          if [ "${COUNT}" -eq 0 ]; then
            echo "ERROR: No IPK generated!"
            exit 1
          fi

      - name: Collect IPK
        run: |
          set -eux

          mkdir -p output

          find sdk/bin \
            -type f \
            -name 'luci-app-openclash_*.ipk' \
            -exec cp -v {} output/ \;

          ls -lh output

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openclash-${{ inputs.openwrt_version }}-armvirt-64
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 30
