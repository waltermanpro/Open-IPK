jobs:
  sync-openclash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest OpenClash release
        id: release
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/vernesong/OpenClash/releases/latest"

          TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "$API" |
            jq -r '.tag_name')

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Latest OpenClash release: $TAG"
