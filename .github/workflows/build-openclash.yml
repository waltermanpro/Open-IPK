name: Build OpenClash IPK

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "选择 OpenWrt 版本"
        required: true
        type: choice
        default: "25.12.5"
        options:
          # OpenWrt 25.12
          - "25.12.5"
          - "25.12.4"
          - "25.12.3"
          - "25.12.2"
          - "25.12.1"
          - "25.12.0"

          # OpenWrt 24.10
          - "24.10.8"
          - "24.10.7"
          - "24.10.6"
          - "24.10.5"
          - "24.10.4"
          - "24.10.3"
          - "24.10.2"
          - "24.10.1"
          - "24.10.0"

      openclash_branch:
        description: "OpenClash 分支"
        required: true
        type: choice
        default: "master"
        options:
          - "master"

jobs:
  build:
    name: OpenClash - OpenWrt ${{ inputs.openwrt_version }} - armvirt/64

    runs-on: ubuntu-24.04

    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
      OPENWRT_TARGET: armvirt/64
      OPENCLASH_BRANCH: ${{ inputs.openclash_branch }}

    steps:

      # ============================================================
      # 1. 安装编译环境
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            rsync \
            unzip \
            wget \
            zstd \
            file \
            npm

      # ============================================================
      # 2. 下载对应版本 OpenWrt SDK
      # ============================================================
      - name: Download OpenWrt SDK
        shell: bash
        run: |
          set -euxo pipefail

          BASE_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"

          echo "=========================================="
          echo "OpenWrt version : ${OPENWRT_VERSION}"
          echo "Target          : ${OPENWRT_TARGET}"
          echo "=========================================="

          # 下载官方 SHA256 文件
          wget -qO sdk.sha256 \
            "${BASE_URL}/sha256sums"

          # 自动寻找 SDK
          SDK=$(awk '
            $2 ~ /^\.\/openwrt-sdk-.*Linux-x86_64\.tar\.zst$/ {
              sub(/^.\//, "", $2)
              print $2
              exit
            }
          ' sdk.sha256)

          if [ -z "${SDK}" ]; then
            echo "=========================================="
            echo "ERROR: 找不到 OpenWrt SDK"
            echo "=========================================="

            echo
            echo "当前版本:"
            echo "${OPENWRT_VERSION}"

            echo
            echo "Target:"
            echo "${OPENWRT_TARGET}"

            echo
            echo "可用 SDK:"
            grep 'openwrt-sdk-.*tar.zst' sdk.sha256 || true

            exit 1
          fi

          echo
          echo "SDK:"
          echo "${SDK}"

          # 下载 SDK
          wget \
            --retry-connrefused \
            --tries=5 \
            --timeout=30 \
            -O sdk.tar.zst \
            "${BASE_URL}/${SDK}"

          # ========================================================
          # SHA256 校验
          # ========================================================

          EXPECTED=$(grep " ${SDK}$" sdk.sha256 | awk '{print $1}')

          ACTUAL=$(sha256sum sdk.tar.zst | awk '{print $1}')

          echo
          echo "Expected SHA256:"
          echo "${EXPECTED}"

          echo
          echo "Actual SHA256:"
          echo "${ACTUAL}"

          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo
            echo "ERROR: SHA256 校验失败!"
            exit 1
          fi

          echo
          echo "SHA256 verification OK."

      # ============================================================
      # 3. 解压 SDK
      # ============================================================
      - name: Extract SDK
        run: |
          set -eux

          mkdir -p sdk

          tar \
            --use-compress-program=unzstd \
            -xf sdk.tar.zst \
            -C sdk \
            --strip-components=1

          echo
          echo "SDK:"
          ls -lah sdk

      # ============================================================
      # 4. 下载 OpenClash
      # ============================================================
      - name: Clone OpenClash
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch="${OPENCLASH_BRANCH}" \
            https://github.com/vernesong/OpenClash.git \
            openclash

          echo
          echo "OpenClash version:"
          grep '^PKG_VERSION:=' \
            openclash/luci-app-openclash/Makefile || true

          echo
          echo "OpenClash commit:"
          git -C openclash rev-parse --short HEAD

      # ============================================================
      # 5. 复制 OpenClash
      # ============================================================
      - name: Copy OpenClash package
        run: |
          set -eux

          mkdir -p sdk/package/luci-app-openclash

          cp -a \
            openclash/luci-app-openclash/. \
            sdk/package/luci-app-openclash/

      # ============================================================
      # 6. 编译 po2lmo
      # ============================================================
      - name: Build po2lmo
        working-directory: sdk/package/luci-app-openclash/tools/po2lmo
        run: |
          set -eux

          make

          sudo install \
            -m 0755 \
            po2lmo \
            /usr/local/bin/po2lmo

          echo
          echo "po2lmo:"
          command -v po2lmo

      # ============================================================
      # 7. 编译 CodeMirror 6
      # ============================================================
      - name: Build CodeMirror 6
        working-directory: sdk/package/luci-app-openclash/tools/codemirror
        run: |
          set -eux

          npm install

          npx esbuild \
            entry.js \
            --bundle \
            --format=iife \
            --global-name=CM6 \
            --minify \
            --target=es2019 \
            --outfile=../../root/www/luci-static/resources/openclash/js/cm6.min.js \
            --legal-comments=none \
            --loader:.css=text

          rm -rf node_modules

      # ============================================================
      # 8. SDK 配置
      # ============================================================
      - name: SDK defconfig
        working-directory: sdk
        run: |
          set -eux

          make defconfig

      # ============================================================
      # 9. 编译 OpenClash
      # ============================================================
      - name: Build OpenClash
        working-directory: sdk
        run: |
          set -eux

          make \
            package/luci-app-openclash/luci-app-openclash/compile \
            V=s

      # ============================================================
      # 10. 查找 IPK
      # ============================================================
      - name: Find IPK
        run: |
          set -eux

          echo "=========================================="
          echo "Generated IPK"
          echo "=========================================="

          find sdk/bin \
            -type f \
            -name 'luci-app-openclash_*.ipk' \
            -print

          COUNT=$(find sdk/bin \
            -type f \
            -name 'luci-app-openclash_*.ipk' \
            | wc -l)

          if [ "${COUNT}" -eq 0 ]; then
            echo
            echo "ERROR: 没有生成 IPK!"
            exit 1
          fi

      # ============================================================
      # 11. 收集 IPK
      # ============================================================
      - name: Collect IPK
        run: |
          set -eux

          mkdir -p output

          find sdk/bin \
            -type f \
            -name 'luci-app-openclash_*.ipk' \
            -exec cp -v {} output/ \;

          echo
          echo "=========================================="
          echo "最终 IPK"
          echo "=========================================="

          ls -lh output

      # ============================================================
      # 12. 上传 Artifact
      # ============================================================
      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-openclash-${{ inputs.openwrt_version }}-armvirt-64
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 30
